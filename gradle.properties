# Gradle-JVM-Speicher fuer den Build-Prozess
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX ist Pflicht, da das Projekt ausschliesslich androidx.*-Bibliotheken nutzt
android.useAndroidX=true

# Vermeidet doppelte/mehrdeutige R-Klassen-Importe bei einem Einzelmodul-Projekt
android.nonTransitiveRClass=true

# Empfohlener Kotlin-Codestyle
kotlin.code.style=official

# Parallele Builds beschleunigen die Kompilierung
org.gradle.parallel=true
org.gradle.caching=true
